services:
  - type: web
    name: crispr-sim-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: REQUIRE_AUTH
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: crispr-sim-db
          property: connectionString

databases:
  - name: crispr-sim-db
    plan: free
    databaseName: crispr_sim
    user: crispr
